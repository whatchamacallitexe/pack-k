<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Sky Race 3D</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@accf8c825d857497e3d692c9bf34c67ce27796f0/sky%20race/style.css">
</head>
<body style="margin:0;overflow:hidden;background:#000">
  <canvas id="unity-canvas" style="width:100vw;height:100vh"></canvas>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = "https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@accf8c825d857497e3d692c9bf34c67ce27796f0/sky%20race/Build";
    var loaderUrl = buildUrl + "/wing-gl29.loader.js";
    var config = {
      dataUrl: buildUrl + "/wing-gl29.data.unityweb",
      frameworkUrl: buildUrl + "/wing-gl29.framework.js.unityweb",
      codeUrl: buildUrl + "/wing-gl29.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Sky Race 3D",
      productVersion: "1.0",
    };
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => { createUnityInstance(canvas, config).catch(console.error); };
    document.body.appendChild(script);
  </script>
</body>
</html>
