<!DOCTYPE html>
<!-- Ultimate Game Stash file--> 
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->
<html lang="en">
  <base href="https://cdn.jsdelivr.net/gh/bubbls/ugss@main/superchibiknight/">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Super Chibi Knight</title>
  <style>
    html, body { margin: 0; padding: 0; background: black; overflow: hidden; height: 100%; width: 100%; }
    #flash-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: black; }
    ruffle-player { width: 100%; height: 100%; background: black; display: block; }
    #loading-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-family: Arial, sans-serif; font-size: 24px; z-index: 1000; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>
<body>
  <div id="loading-text">Loading game... 0%</div>
  <div id="flash-container"></div>
  <script>
    const container = document.getElementById("flash-container");
    const loadingText = document.getElementById("loading-text");
    function mergeSWFParts(fileParts) {
      return new Promise((resolve, reject) => {
        let buffers = [], totalSize = 0, loadedSize = 0;
        function updateProgress() {
          if (totalSize > 0 && loadingText) loadingText.textContent = `Loading game... ${Math.round((loadedSize / totalSize) * 100)}%`;
        }
        function fetchPart(i) {
          if (i >= fileParts.length) {
            if (loadingText) loadingText.textContent = 'Merging files...';
            resolve(URL.createObjectURL(new Blob(buffers, { type: 'application/x-shockwave-flash' })));
            return;
          }
          fetch(fileParts[i]).then(response => {
            if (!response.ok) throw new Error('Failed part ' + i);
            const cl = response.headers.get('content-length');
            if (cl) totalSize += parseInt(cl);
            return response.arrayBuffer();
          }).then(data => {
            buffers.push(data); loadedSize += data.byteLength; updateProgress(); fetchPart(i + 1);
          }).catch(reject);
        }
        fetchPart(0);
      });
    }
    function resizeGame() {
      const ar = 4/3;
      let width = Math.floor(window.innerWidth), height = Math.floor(width / ar);
      if (height > window.innerHeight) { height = Math.floor(window.innerHeight); width = Math.floor(height * ar); }
      container.style.width = width + 'px'; container.style.height = height + 'px';
    }
    window.addEventListener("resize", resizeGame);
    window.addEventListener("DOMContentLoaded", () => {
      resizeGame();
      const parts = [];
      for (let i = 1; i <= 3; i++) parts.push('super-chibi-knight-w-178090d96.swf.part' + i);
      mergeSWFParts(parts).then(swfUrl => {
        if (loadingText) loadingText.textContent = 'Starting game...';
        const ruffle = window.RufflePlayer && window.RufflePlayer.newest && window.RufflePlayer.newest();
        if (!ruffle) { if (loadingText) loadingText.textContent = 'Ruffle failed'; return; }
        const player = ruffle.createPlayer();
        player.style.width = player.style.height = '100%';
        container.appendChild(player);
        player.load(swfUrl).then(() => { if (loadingText) loadingText.remove(); }).catch(err => {
          if (loadingText) loadingText.textContent = 'Error: ' + err.message;
        });
      }).catch(err => {
        if (loadingText) loadingText.textContent = 'Error: ' + err.message;
      });
    });
  </script>
</body>
</html>
