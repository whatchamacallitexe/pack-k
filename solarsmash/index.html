<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=100% height=100% tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
  </div>

<script async>
    function mergeFiles(fileParts) {
        return new Promise((resolve, reject) => {
            let buffers = [];
            function fetchPart(index) {
                if (index >= fileParts.length) {
                    let mergedBlob = new Blob(buffers, { type: "application/octet-stream" });
                    resolve(mergedBlob);
                    return;
                }
                fetch(fileParts[index])
                    .then((response) => response.arrayBuffer())
                    .then((data) => {
                        buffers.push(data);
                        fetchPart(index + 1);
                    })
                    .catch(reject);
            }
            fetchPart(0);
        });
    }

    function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
            parts.push(file + ".part" + i);
        }
        return parts;
    }

    Promise.all([
        mergeFiles(getParts("StreamingAssets/AssetBundles/WebGL/planets", 1, 2)),
        mergeFiles(getParts("StreamingAssets/AssetBundles/WebGL/planets2", 1, 2))
    ]).then(([planets1, planets2]) => {
        const originalFetch = window.fetch;
        window.fetch = async function (...args) {
            const url = args[0];
            if (typeof url === "string" && url.includes("StreamingAssets/AssetBundles/WebGL/planets")) {
                if (url.includes("planets2")) {
                    return new Response(planets2, { status: 200 });
                } else if (url.includes("planets3")) {
                    return originalFetch.apply(this, args);
                } else {
                    return new Response(planets1, { status: 200 });
                }
            }
            return originalFetch.apply(this, args);
        };
    });
</script>

  <script src="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@a2e4bb68955f2665d16669bbbf7be3123870c2e0/solar-smash/lib/jszip.min.js"></script>
  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");

    function unityShowBanner(msg, type) {}

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Build.loader.js";
    var config = {
      dataUrl: buildUrl + "/Build.data",
      frameworkUrl: buildUrl + "/Build.framework.js",
      codeUrl: buildUrl + "/Build.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Paradyme Games",
      productName: "Live - Solar Smash YouTube",
      productVersion: "0.1.0",
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      container.className = "unity-mobile";
      canvas.className = "unity-mobile";
    } else {
      canvas.style.width = "100%";
      canvas.style.height = "100%";
    }

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
      }).catch((message) => {
        console.error(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
