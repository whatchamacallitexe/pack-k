<!-- Ultimate Game Stash file-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Stick War</title>
  <style>
    html, body { margin: 0; padding: 0; background: black; overflow: hidden; height: 100%; width: 100%; }
    #flash-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: black; }
    ruffle-player { width: 100%; height: 100%; display: block; background: black; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>
<body>
  <div id="flash-container"></div>
  <script>
    const SWF_URL = "https://cdn.jsdelivr.net/gh/AsePlayer/Stick-War-Classic@92a6cd343acd325c59f4201d00f7f98ed9c98c1d/Stick_War_1.swf";
    const container = document.getElementById("flash-container");
    function resize() {
      const ar = 4/3;
      let w = window.innerWidth, h = Math.floor(w / ar);
      if (h > window.innerHeight) { h = window.innerHeight; w = Math.floor(h * ar); }
      container.style.width = w + "px";
      container.style.height = h + "px";
    }
    window.addEventListener("resize", resize);
    window.addEventListener("DOMContentLoaded", () => {
      resize();
      const r = window.RufflePlayer && window.RufflePlayer.newest && window.RufflePlayer.newest();
      if (!r) { container.textContent = "Ruffle failed"; return; }
      const p = r.createPlayer();
      p.style.width = p.style.height = "100%";
      container.appendChild(p);
      p.load(SWF_URL);
    });
  </script>
</body>
</html>
