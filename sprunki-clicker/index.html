<!-- Ultimate Game Stash file-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sprunki Clicker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html,body{margin:0;overflow:hidden;background:#1a1a2e;height:100%;width:100%;font-family:sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column}
    #count{font-size:64px;font-weight:bold;margin:16px}
    button{font-size:24px;padding:16px 32px;border:none;border-radius:12px;background:#e94560;color:#fff;cursor:pointer}
    button:active{transform:scale(0.95)}
  </style>
</head>
<body>
  <div>Sprunki Clicker</div>
  <div id="count">0</div>
  <button id="btn">Click!</button>
  <script>
    let n = parseInt(localStorage.getItem('sprunki_clk')||'0',10);
    const el = document.getElementById('count');
    el.textContent = n;
    document.getElementById('btn').onclick = () => {
      n++; el.textContent = n;
      localStorage.setItem('sprunki_clk', String(n));
    };
  </script>
</body>
</html>
