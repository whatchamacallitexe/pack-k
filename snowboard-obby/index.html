<!-- Ultimate Game Stash file-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Snowboard Obby</title>
<style>html,body,#container,#fr{margin:0;padding:0;overflow:hidden;height:100%;width:100%}</style>
</head>
<body>
<div id="container">
  <iframe id="fr" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
</div>
<script>
const FILE_URL = 'https://cdn.jsdelivr.net/gh/shayderrr/portsv2@main/1.xml';
fetch(FILE_URL).then(r=>r.text()).then(xml=>{
  // try extract game url from xml or use as data path
  const m = xml.match(/https?:\/\/[^\s"'<>]+/);
  if (m) document.getElementById('fr').src = m[0];
  else document.getElementById('fr').src = FILE_URL;
}).catch(()=>{ document.getElementById('fr').src = FILE_URL; });
</script>
</body>
</html>
