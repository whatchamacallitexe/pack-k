<!-- Ultimate Game Stash file-->
<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <base href="https://cdn.jsdelivr.net/gh/galaxyking16/r@main/">
  <title>Six Cats Under</title>
  <script src="Build/UnityLoader.js"></script>
  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "Build/web.json");
    function onResize() {
      var canvas = gameInstance.Module.canvas;
      var container = gameInstance.container;
      var w = window.innerWidth, h = window.innerHeight;
      var r = 540 / 960;
      if (w * r > window.innerHeight) w = Math.min(w, Math.ceil(h / r));
      h = Math.floor(w * r);
      container.style.width = canvas.style.width = w + "px";
      container.style.height = canvas.style.height = h + "px";
      container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
      container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
    }
    window.addEventListener("resize", onResize);
  </script>
  <style>
    html, body { background: #000; width: 100%; height: 100%; overflow: hidden; margin: 0; }
    div#gameContainer { background: transparent !important; position: absolute; }
  </style>
</head>
<body onload="onResize();">
  <div id="gameContainer" data-pixelated="true"></div>
</body>
</html>
