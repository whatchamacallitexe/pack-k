<!-- Ultimate Game Stash file-->
<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/bubblfan/web-port@main/slender/">
  <meta charset="utf-8">
  <title>Slenderman: The 8 Pages</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;overflow:hidden;background:#000">
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Slender.loader.js";
    var config = {
      dataUrl: buildUrl + "/Slender.data",
      frameworkUrl: buildUrl + "/Slender.framework.js",
      codeUrl: buildUrl + "/Slender.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Slenderman",
      productVersion: "1.0",
    };
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => { createUnityInstance(canvas, config).catch(console.error); };
    document.body.appendChild(script);
  </script>
</body>
</html>
