function setupXHRInterceptor(){if(window.xhrInterceptorInstalled)return;const o=XMLHttpRequest.prototype.open,s=XMLHttpRequest.prototype.send;XMLHttpRequest.prototype.open=function(m,u,...a){let f=u;for(const[n,b]of Object.entries(window.mergedBlobUrls)){if(u.includes(n)){f=b;break;}}return o.call(this,m,f,...a);};XMLHttpRequest.prototype.send=function(...a){const x=this;if(!window.assetsReady){const c=setInterval(()=>{if(window.assetsReady){clearInterval(c);s.apply(x,a);}},50);return;}return s.apply(this,a);};window.xhrInterceptorInstalled=true;}
async function prepareGameAssets(){try{window.assetsReady=false;window.mergedBlobUrls={};setupXHRInterceptor();for(const f of["ZurichNewPrivacy.data.unityweb","ZurichNewPrivacy.wasm.code.unityweb"]){const b=await mergeSplitFile(f,2);if(b)window.mergedBlobUrls[f]=b;}window.assetsReady=true;}catch(e){window.assetsReady=true;}}
