<!-- Ultimate Game Stash file-->
<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@a2e4bb68955f2665d16669bbbf7be3123870c2e0/solar-smash/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Smash</title>
  <link rel="stylesheet" href="TemplateData/style.css">
  <script src="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@main/ytgame.js"></script>
</head>
<body style="margin:0;overflow:hidden;background:#000">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=960 height=600></canvas>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/SolarSmash.loader.js";
    var config = {
      dataUrl: buildUrl + "/SolarSmash.data.unityweb",
      frameworkUrl: buildUrl + "/SolarSmash.framework.js.unityweb",
      codeUrl: buildUrl + "/SolarSmash.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Solar Smash",
      productVersion: "1.0",
    };
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config).catch(console.error);
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
