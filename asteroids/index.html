<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Asteroids</title>
	<style>
		body { overflow: hidden; background: #000000; margin: 0; color: #000000; }
		#startButton { display: block; width: 160px; height: 40px; background-color: #4CAF50; color: white; text-align: center; font-size: 16px; margin: 20px auto; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }
	</style>
</head>
<body>
	<div style="width: 100vw; height: 100vh;">
		<div id="game" style="display: none;"></div>
		<button id="startButton">PLAY</button>
	</div>
	<script>
		function startGame() {
			document.getElementById("game").style.display = "block";
			document.getElementById("startButton").style.display = "none";
			EJS_player = "#game";
			EJS_core = "atari2600";
			EJS_color = "#000000";
			EJS_startOnLoaded = true;
			EJS_pathtodata = "../_shared/emu/";
			EJS_gameUrl = "assets/cdn/6655ff6a-Asteroids_Japan_USA_En_.zip";
			loadGame(); 
		}
		document.getElementById("startButton").addEventListener("click", startGame);
		function loadGame() {
			var script = document.createElement("script");
			script.src = "../_shared/emu//loader.js";
			document.body.appendChild(script);
		}
	</script>
</body>
</html>
