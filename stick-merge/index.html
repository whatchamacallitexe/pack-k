<head>
  <title>Stick Merge</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="robots" content="noindex,nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <script src="poki-sdk.js"></script>
  <script src="poki-sdk-core-v2.263.0.js" type="text/javascript" crossorigin="anonymous"></script>
  <script src="js/webfont.js"></script>
  <script src="js/phaser.min.js"></script>

  <script src="js/plugin-api-poki.js"></script>
  <script src="js/HorizontalSlider.js"></script>
  <script src="js/Buttons.js"></script>

  <style>
    .pokiSdkContainer {
      overflow: hidden;
      position: absolute;
      left: 0; top: 0; width: 100%; height: 100%;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pokiSdkContainer.pokiSdkFixed { position: fixed; }
    .pokiSdkContainer.pokiSdkVisible { display: block; }
    .pokiSdkContainer.pokiSdkHidden,
    .pokiSdkSpinnerContainer.pokiSdkHidden { display: none; }
    .pokiSdkContainer.pokiSdkHidden,
    .pokiSdkSpinnerContainer { pointer-events: none; }
    .pokiSdkSpinnerContainer {
      z-index: 10;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('images/thumb_anim_2x.gif') 50% 50% no-repeat;
      user-select: none;
    }
    .pokiSdkInsideContainer {
      background: #000;
      position: relative;
      z-index: 1;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
    .pokiSdkContainer.pokiSdkVisible .pokiSdkInsideContainer { opacity: 1; }
  </style>
</head>

<body style="height: 100%;">
  <div id="game-container" style="overflow: hidden; width: 100%; height: 100%;">
  </div>
  <div id="orientation"></div>
  <div id="banner"></div>
  <script src="js/m.js"></script>
</body>
