<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bullet Force</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; outline: none; }
    #loading-text {
      position: fixed; top: 20px; left: 0; right: 0; z-index: 10;
      color: #fff; font-size: 20px; font-family: system-ui, sans-serif;
      text-align: center; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loading-text">LOADING…</div>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <script>
  (function () {
    var loadingText = document.getElementById("loading-text");
    var canvas = document.getElementById("unity-canvas");

    // Local only — files next to this HTML under Build/
    var FILES = [
      {
        name: "584aaab0eb92d84ef26110ca5439bc54.wasm.gz",
        kind: "wasm",
        parts: 8
      },
      {
        name: "7edaab9530d578d742b70ec34add0032.data.gz",
        kind: "data",
        parts: 19
      }
    ];

    async function fetchPart(path) {
      var res = await fetch(path);
      if (!res.ok) throw new Error("HTTP " + res.status + " " + path);
      return res.arrayBuffer();
    }

    async function mergeFile(info) {
      var buffers = [];
      for (var i = 1; i <= info.parts; i++) {
        var path = "Build/" + info.name + ".part" + i;
        loadingText.textContent = "LOADING " + info.name + " " + i + "/" + info.parts;
        buffers.push(await fetchPart(path));
      }
      var mime = info.kind === "wasm" ? "application/wasm" : "application/octet-stream";
      return URL.createObjectURL(new Blob(buffers, { type: mime }));
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    }
    window.addEventListener("resize", resize);
    resize();

    (async function () {
      try {
        var wasmUrl = await mergeFile(FILES[0]);
        var dataUrl = await mergeFile(FILES[1]);

        var config = {
          dataUrl: dataUrl,
          frameworkUrl: "Build/fd74eec22ed0b1f79484c6a782ad39af.framework.js",
          codeUrl: wasmUrl,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Bullet Force",
          productName: "Bullet Force",
          productVersion: "1.0.0"
        };

        loadingText.textContent = "Starting Unity…";
        await new Promise(function (resolve, reject) {
          var script = document.createElement("script");
          script.src = "Build/bb0d9ecdb05db3e84da20bd14a4f84dc.loader.js";
          script.onload = resolve;
          script.onerror = function () { reject(new Error("Failed Build/…loader.js")); };
          document.body.appendChild(script);
        });

        await createUnityInstance(canvas, config, function (p) {
          loadingText.textContent = "STARTING… " + Math.round(p * 100) + "%";
        });
        loadingText.style.display = "none";
      } catch (err) {
        loadingText.style.color = "#ff5555";
        loadingText.textContent = "FAILED: " + (err && err.message ? err.message : err);
        console.error(err);
      }
    })();
  })();
  </script>
</body>
</html>
