			background: #000;
			color: #fff;
			overflow: hidden;
			touch-action: none;

			touch-action-delay: none;

<script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@5d4fe73206f86e89e5c4aa81811178d313a76861/offlineClientbear.js"></script>

</head> 
 
<body> 
	<div id="fb-root"></div>
	<script>
	(function(){
		if (window.location.protocol.substr(0, 4) ==="file")
		{
			alert("Exported games won't work until you upload them.");
		}
	})();
	</script>
	
	<div id="c2canvasdiv" style="width: 1122px; height: 748px; margin-left: 0px; margin-top: 66px;">
		<canvas id="c2canvas" width="1122" height="748" style="width: 1122px; height: 748px;">
			<h1>Your browser does not appear to support HTML5.</h1>
		</canvas>
	</div>
	
	<script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@5d4fe73206f86e89e5c4aa81811178d313a76861/jquery-2.1.1.minbear.js"></script>
	<script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@5d4fe73206f86e89e5c4aa81811178d313a76861/c2runtimebear.js"></script>
    <script>
		jQuery(document).ready(function ()
		{			
			cr_createRuntime("c2canvas");
		});
		
		function onVisibilityChanged() {
			if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
				cr_setSuspended(true);
			else
				cr_setSuspended(false);
		};
		
		document.addEventListener("visibilitychange", onVisibilityChanged, false);
		document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("msvisibilitychange", onVisibilityChanged, false);
		
		function OnRegisterSWError(e)
		{
			console.warn("Failed to register service worker: ", e);
		};
		
		window.C2_RegisterSW = function C2_RegisterSW()
		{
			if (!navigator.serviceWorker)
				return;		
			try {
				navigator.serviceWorker.register("sw.js", { scope: "./" })
				.then(function (reg)
				{
					console.log("Registered service worker on " + reg.scope);
				})
				.catch(OnRegisterSWError);
			}
			catch (e)
			{
				OnRegisterSWError(e);
			}
		};
    </script>
</body>
</html>
