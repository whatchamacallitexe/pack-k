<!DOCTYPE html>
<html lang="en">
<head>
  <base href="https://cdn.jsdelivr.net/gh/mynamescrax/gamesforaetheris@main/switch/">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Switch!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #13141E; overflow: hidden; }
    #unity-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; outline: none; }
  </style>
</head>
<body>
  <canvas id="unity-canvas"></canvas>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loaderUrl = "Build/Switch.loader.js";
    var config = {
      dataUrl: "Build/Switch.data",
      frameworkUrl: "Build/Switch.framework.js",
      codeUrl: "Build/Switch.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Switch",
      productVersion: "1.0",
    };
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, () => {}).catch(console.error);
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
