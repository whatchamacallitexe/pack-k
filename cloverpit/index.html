<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>CloverPit</title>
  <!-- Local only: same folder as this HTML → TemplateData / Build -->
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #231F20; }
    #loading-text {
      color: #fff; font-size: 22px; font-family: system-ui, sans-serif;
      text-align: center; margin-top: 24px; position: relative; z-index: 5;
    }
  </style>
</head>
<body>
  <div id="loading-text">LOADING…</div>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="540" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <script>
  (function () {
    var loadingText = document.querySelector("#loading-text");
    var loadedBytes = 0;
    var totalMb = "87";

    async function fetchPart(url) {
      var response = await fetch(url);
      if (!response.ok) throw new Error("HTTP " + response.status + " " + url);
      var buf = await response.arrayBuffer();
      loadedBytes += buf.byteLength;
      loadingText.textContent =
        "LOADING… " + (loadedBytes / (1024 * 1024)).toFixed(1) + " MB / ~" + totalMb + " MB";
      return buf;
    }

    async function mergeParts(prefix, count, mime) {
      var buffers = [];
      for (var i = 1; i <= count; i++) {
        buffers.push(await fetchPart(prefix + ".part" + i));
      }
      return URL.createObjectURL(new Blob(buffers, { type: mime || "application/octet-stream" }));
    }

    (async function () {
      try {
        // Relative to this index.html — no CDN
        var dataUrl = await mergeParts("Build/CloverPit.data", 3, "application/octet-stream");
        var wasmUrl = await mergeParts("Build/CloverPit.wasm", 3, "application/wasm");

        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");

        var config = {
          arguments: [],
          dataUrl: dataUrl,
          frameworkUrl: "Build/CloverPit.framework.js",
          codeUrl: wasmUrl,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Panik Arcade",
          productName: "CloverPit",
          productVersion: "1.3",
          showBanner: function () {}
        };

        loadingBar.style.display = "block";
        loadingText.textContent = "Starting Unity…";

        await new Promise(function (resolve, reject) {
          var script = document.createElement("script");
          script.src = "Build/CloverPit.loader.js";
          script.onload = resolve;
          script.onerror = function () { reject(new Error("Failed to load Build/CloverPit.loader.js")); };
          document.body.appendChild(script);
        });

        await createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (100 * progress) + "%";
          loadingText.textContent = "STARTING… " + Math.round(progress * 100) + "%";
        });

        loadingBar.style.display = "none";
        loadingText.style.display = "none";
      } catch (err) {
        loadingText.style.color = "#ff5555";
        loadingText.textContent = "FAILED: " + (err && err.message ? err.message : err);
        console.error(err);
      }
    })();
  })();
  </script>
</body>
</html>
