name: Import game assets (cloud only)

# AI or you can trigger this — runs only on GitHub servers (free for public repos).
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repo under whatchamacallitexe"
        required: true
        type: choice
        options:
          - UGS-Assets
          - clover-pit
          - ugss
        default: UGS-Assets
      source_path:
        description: "Folder in source repo, or FULL for entire repo"
        required: true
        default: "superhot"
      dest_path:
        description: "Folder name inside this pack"
        required: true
        default: "superhot"

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout pack repo
        uses: actions/checkout@v4

      - name: Clone source on runner (not your PC)
        env:
          SRC_REPO: ${{ inputs.source_repo }}
          SRC_PATH: ${{ inputs.source_path }}
          DEST: ${{ inputs.dest_path }}
        run: |
          set -euo pipefail
          echo "Importing ${SRC_REPO}/${SRC_PATH} → ${DEST}"

          if [ "${SRC_PATH}" = "FULL" ]; then
            git clone --depth 1 \
              "https://github.com/whatchamacallitexe/${SRC_REPO}.git" /tmp/src
            SRC_DIR=/tmp/src
          else
            git clone --depth 1 --filter=blob:none --sparse \
              "https://github.com/whatchamacallitexe/${SRC_REPO}.git" /tmp/src
            cd /tmp/src
            git sparse-checkout set "${SRC_PATH}"
            if [ ! -e "${SRC_PATH}" ]; then
              echo "ERROR: path not found: ${SRC_PATH}"
              ls -la
              exit 1
            fi
            SRC_DIR="/tmp/src/${SRC_PATH}"
          fi

          echo "Size: $(du -sh "${SRC_DIR}" | cut -f1)"

          rm -rf "${GITHUB_WORKSPACE}/${DEST}"
          mkdir -p "${GITHUB_WORKSPACE}/${DEST}"
          # If SRC is a directory, copy contents; if file, copy file
          if [ -d "${SRC_DIR}" ]; then
            cp -a "${SRC_DIR}/." "${GITHUB_WORKSPACE}/${DEST}/"
          else
            cp -a "${SRC_DIR}" "${GITHUB_WORKSPACE}/${DEST}/"
          fi
          rm -rf "${GITHUB_WORKSPACE}/${DEST}/.git"

          echo "File count: $(find "${GITHUB_WORKSPACE}/${DEST}" -type f | wc -l)"
          find "${GITHUB_WORKSPACE}/${DEST}" -type f | head -40

      - name: Commit and push
        env:
          DEST: ${{ inputs.dest_path }}
          SRC_REPO: ${{ inputs.source_repo }}
          SRC_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "${DEST}"
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Import ${SRC_REPO}/${SRC_PATH} → ${DEST} (cloud)"
          git config http.postBuffer 524288000
          git push origin HEAD

      - name: Summary
        env:
          DEST: ${{ inputs.dest_path }}
        run: |
          echo "### Done: ${DEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "No download on your computer. Free public Actions minutes." >> "$GITHUB_STEP_SUMMARY"
