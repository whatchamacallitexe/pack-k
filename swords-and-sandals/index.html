<!-- Ultimate Game Stash file-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Swords and Sandals</title>
  <style>
    html, body { margin: 0; padding: 0; background: black; overflow: hidden; height: 100%; width: 100%; }
    #flash-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: black; }
    ruffle-player { width: 100%; height: 100%; display: block; background: black; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>
<body>
  <div id="flash-container"></div>
  <script>
    const SWF_URL = "https://cdn.jsdelivr.net/gh/filesmabex/z3x4@main/swords-and-sandals-2.swf";
    const container = document.getElementById("flash-container");
    function resize() {
      let w = window.innerWidth, h = Math.floor(w * 3/4);
      if (h > window.innerHeight) { h = window.innerHeight; w = Math.floor(h * 4/3); }
      container.style.width = w + "px"; container.style.height = h + "px";
    }
    window.addEventListener("resize", resize);
    window.addEventListener("DOMContentLoaded", () => {
      resize();
      const r = window.RufflePlayer && window.RufflePlayer.newest && window.RufflePlayer.newest();
      if (!r) { container.textContent = "Ruffle failed"; return; }
      const p = r.createPlayer(); p.style.width = p.style.height = "100%";
      container.appendChild(p); p.load(SWF_URL);
    });
  </script>
</body>
</html>
