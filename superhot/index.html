<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="hot.jpg">
  <title>SUPERHOT</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas.emscripten { display: block; width: 100%; height: 100%; }
    #status {
      position: fixed; top: 16px; left: 0; right: 0; text-align: center;
      color: #fff; font-family: system-ui, sans-serif; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="status">LOADING…</div>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <script>
  (function () {
    var status = document.getElementById("status");

    // All paths relative to this HTML file (same folder)
    async function mergeParts(base, count) {
      var buffers = [];
      for (var i = 1; i <= count; i++) {
        status.textContent = "LOADING… " + base + " part " + i + "/" + count;
        var r = await fetch(base + ".part" + i);
        if (!r.ok) throw new Error("Failed " + base + ".part" + i);
        buffers.push(await r.arrayBuffer());
      }
      return URL.createObjectURL(new Blob(buffers, { type: "application/octet-stream" }));
    }

    (async function () {
      try {
        // webgl.jsgz is split into .part1 + .part2
        var codeUrl = await mergeParts("webgl.jsgz", 2);

        window.Module = {
          TOTAL_MEMORY: 268435456,
          errorhandler: null,
          compatibilitycheck: null,
          dataUrl: "webgl.datagz",
          codeUrl: codeUrl,
          memUrl: "webgl.memgz",
          canvas: document.getElementById("canvas")
        };

        // Intercept XHR/fetch for webgl.jsgz → blob
        var origFetch = window.fetch.bind(window);
        window.fetch = function (resource, options) {
          var url = typeof resource === "string" ? resource : (resource && resource.url) || "";
          if (url.indexOf("webgl.jsgz") !== -1 && url.indexOf(".part") === -1) {
            return origFetch(codeUrl, options);
          }
          return origFetch(resource, options);
        };

        status.textContent = "Starting SUPERHOT…";
        await new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = "UnityLoader.js";
          s.onload = resolve;
          s.onerror = function () { reject(new Error("UnityLoader.js missing")); };
          document.body.appendChild(s);
        });

        // Older Unity web builds read Module after UnityLoader loads
        if (typeof UnityLoader !== "undefined" && UnityLoader.instantiate) {
          // Some builds use instantiate; canvas already set on Module
        }
        status.style.display = "none";
      } catch (err) {
        status.style.color = "#ff5555";
        status.textContent = "FAILED: " + (err && err.message ? err.message : err);
        console.error(err);
      }
    })();
  })();
  </script>
</body>
</html>
